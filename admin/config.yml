backend:
  name: git-gateway
  branch: main

locale: fr

media_folder: "images"
public_folder: "/images"

collections:
  - name: "evenements"
    label: "Événements"
    files:
      - label: "Liste des événements"
        name: "events"
        file: "data/events.json"
        fields:
          - label: "Événements"
            name: "events"
            widget: "list"
            fields:
              - {label: "Jour (ex: 20)", name: "day", widget: "string"}
              - {label: "Mois (ex: Sept 2026)", name: "month", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Détails (lieu, durée…)", name: "detail", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Lien HelloAsso (laisser vide si pas encore dispo)", name: "link", widget: "string", required: false}

  - name: "partenaires"
    label: "Partenaires"
    files:
      - label: "Liste des partenaires"
        name: "partners"
        file: "data/partners.json"
        fields:
          - label: "Partenaires"
            name: "partners"
            widget: "list"
            fields:
              - {label: "Nom", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
              - {label: "Tag (ex: Partenaire officiel)", name: "tag", widget: "string"}
